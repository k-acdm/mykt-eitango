<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かつら WebP 確認</title>
<style>
  :root{
    --ink:#1c1a17; --paper:#faf8f5; --line:#d9d2c7;
    --ok:#1b6b3a; --ng:#a8261f; --dim:#6b6358;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    background:var(--paper); color:var(--ink);
    font:16px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:21px;font-weight:600;margin:0 0 4px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:14px;margin:0 0 24px}
  .verdict{
    border:2px solid var(--line); border-radius:10px;
    padding:18px 18px 16px; margin:0 0 24px; background:#fff;
  }
  .verdict b{display:block;font-size:19px;margin-bottom:6px}
  .verdict.pass{border-color:var(--ok)} .verdict.pass b{color:var(--ok)}
  .verdict.fail{border-color:var(--ng)} .verdict.fail b{color:var(--ng)}
  .verdict p{margin:0;font-size:14px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;margin:0 0 24px;font-size:15px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;width:58%}
  td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .y{color:var(--ok);font-weight:600}
  .n{color:var(--ng);font-weight:600}
  h2{font-size:15px;font-weight:600;margin:28px 0 10px}
  canvas{
    width:100%;max-width:300px;height:auto;display:block;
    border:1px solid var(--line);border-radius:6px;background:
      repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;
  }
  .note{font-size:13px;color:var(--dim);margin:8px 0 0}
  pre{
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:0;
  }
</style>
</head>

const rows = [];
function add(name, ok, detail){
  rows.push({name, ok, detail});
  document.getElementById('result').innerHTML = rows.map(r =>
    `<tr><th>${r.name}</th><td class="r ${r.ok===null?'':(r.ok?'y':'n')}">${
      r.ok===null ? '' : (r.ok ? '✓' : '✕')
    } ${r.detail||''}</td></tr>`
  ).join('');
}

function load(src){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('読めません'));
    im.src = src;
  });
}

// 白黒画像 → アルファ（白=不透明 / 黒=透明）。本番 index.html と同じ式
function maskToAlpha(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4){
    const lum = (p[i]*299 + p[i+1]*587 + p[i+2]*114) / 1000;
    p[i+3] = Math.round(lum * p[i+3] / 255);
    p[i] = 0; p[i+1] = 0; p[i+2] = 0;
  }
  x.putImageData(d, 0, 0);
  return c;
}

// 肌色の塗り替え（見本の式そのまま）
function recolor(ctx, w, h, maskCv, tint){
  const mk = maskCv.getContext('2d', {willReadFrequently:true})
                   .getImageData(0, 0, w, h).data;
  const d = ctx.getImageData(0, 0, w, h), p = d.data;
  const [tr, tg, tb, ta] = tint;
  let n = 0;
  for (let i = 0; i < p.length; i += 4){
    if (mk[i+3] === 0) continue;
    const r = p[i], g = p[i+1], b = p[i+2];
    if (p[i+3] === 0) continue;
    if (!(r > 170 && g > 120 && b > 90 && r >= g && g >= b - 5 && (r - b) > 15)) continue;
    const lum = (r + g + b) / 3;
    p[i]   = Math.min(255, Math.max(0, Math.round(tr * lum / ta)));
    p[i+1] = Math.min(255, Math.max(0, Math.round(tg * lum / ta)));
    p[i+2] = Math.min(255, Math.max(0, Math.round(tb * lum / ta)));
    n++;
  }
  ctx.putImageData(d, 0, 0);
  return n;
}

(async function(){
  document.getElementById('ua').textContent =
    navigator.userAgent + '\n画面 ' + screen.width + '×' + screen.height +
    ' / 倍率 ' + (window.devicePixelRatio || 1);

  let allOk = true;
  const t0 = performance.now();

  // 1 WebP が読めるか
  let layer, hat;
  try{
    const t = performance.now();
    layer = await load(SRC.layer);
    hat   = await load(SRC.hat);

  }catch(e){
    add('WebP が読める', false, '読めません');
    allOk = false;
    document.getElementById('verdict').className = 'verdict fail';
    document.getElementById('verdict').innerHTML =
      '<b>WebP が読めません</b><p>この端末では使えません。作成スレに PNG のままにしてもらう必要があります。</p>';
    return;
  }

  // 2 大きさ
  const w = layer.naturalWidth, h = layer.naturalHeight;
  add('大きさ', w === 887 && h === 1774, w + '×' + h);

  // 3 透明が残っているか
  const tc = document.createElement('canvas');
  tc.width = w; tc.height = h;
  const tx = tc.getContext('2d', {willReadFrequently:true});
  tx.drawImage(layer, 0, 0);
  const sample = tx.getImageData(0, 0, 40, 40).data;
  let clear = 0;
  for (let i = 3; i < sample.length; i += 4) if (sample[i] === 0) clear++;
  add('WebP の透明が残る', clear > 0, clear + '/1600 画素が透明');
  if (clear === 0) allOk = false;

  // 4 マスク（1ビットPNG）→ アルファ
  let tm = performance.now();
  const erase = maskToAlpha(await load(SRC.erase));
  const mt = Math.round(performance.now() - tm);
  const em = erase.getContext('2d', {willReadFrequently:true}).getImageData(0,0,w,h).data;
  let opaque = 0, transparent = 0;
  for (let i = 3; i < em.length; i += 4){ em[i] > 200 ? opaque++ : (em[i] < 20 ? transparent++ : 0); }
  const maskOk = opaque > 0 && transparent > 0;
  add('1ビットPNG をアルファに変換', maskOk, mt + 'ms');
  if (!maskOk) allOk = false;

  // 5 合成
  const cv = document.getElementById('cv');
  const cx = cv.getContext('2d', {willReadFrequently:true});
  const tcomp = performance.now();

  // 人体のかわり（肌色の面。塗り替えが効くか見るため）
  cx.fillStyle = '#e8bd9a';
  cx.fillRect(140, 300, 610, 900);

  // 4 消す範囲で透明に
  cx.globalCompositeOperation = 'destination-out';
  cx.drawImage(erase, 0, 0);
  cx.globalCompositeOperation = 'source-over';
  const afterErase = cx.getImageData(0,0,w,h).data;
  let left = 0;
  for (let i = 3; i < afterErase.length; i += 4) if (afterErase[i] > 0) left++;
  add('destination-out で消える', left > 0 && left < w*h, '残り ' + Math.round(left/10000)/100 + '万画素');

  // 5 層を重ねる
  cx.drawImage(layer, 0, 0);

  // 肌色の塗り替え
  const rc = maskToAlpha(await load(SRC.recolor));
  tm = performance.now();
  const changed = recolor(cx, w, h, rc, [221,162,118,231]);
  const rt = Math.round(performance.now() - tm);
  add('肌色の塗り替え（1画素ずつ）', changed > 0, changed.toLocaleString() + '画素 / ' + rt + 'ms');
  if (changed === 0) allOk = false;

  // 7 帽子層
  cx.drawImage(hat, 0, 0);

  // 9 メガネを上に出す範囲（destination-in が効くか）
  const top = maskToAlpha(await load(SRC.glassTop));
  const t2 = document.createElement('canvas');
  t2.width = w; t2.height = h;
  const x2 = t2.getContext('2d', {willReadFrequently:true});
  x2.fillStyle = '#2b6cb0'; x2.fillRect(0,0,w,h);
  x2.globalCompositeOperation = 'destination-in';
  x2.drawImage(top, 0, 0);
  const d2 = x2.getImageData(0,0,w,h).data;
  let kept = 0;
  for (let i = 3; i < d2.length; i += 4) if (d2[i] > 0) kept++;
  add('destination-in で範囲だけ残る', kept > 0 && kept < w*h, Math.round(kept/10000)/100 + '万画素');

  const ct = Math.round(performance.now() - tcomp);
  add('重ね合わせ全体', true, ct + 'ms');

  // toDataURL
  tm = performance.now();
  let durl = '';
  try{ durl = cv.toDataURL('image/png'); }catch(e){}
  const dt = Math.round(performance.now() - tm);
  add('1枚の画像に書き出す', durl.length > 1000, Math.round(durl.length/1024) + 'KB / ' + dt + 'ms');
  if (durl.length <= 1000) allOk = false;

  add('最初から最後まで', null, Math.round(performance.now() - t0) + 'ms');

  const v = document.getElementById('verdict');
  if (allOk){
    v.className = 'verdict pass';
    v.innerHTML = '<b>この端末で使えます</b><p>WebP も、切り抜きも、塗り替えも動きました。下の絵が崩れていなければ合格です。</p>';
  }else{
    v.className = 'verdict fail';
    v.innerHTML = '<b>動かない所があります</b><p>上の表で ✕ が付いた行を、そのまま知らせてください。</p>';
  }
})();
</script>
</body>
</html>
