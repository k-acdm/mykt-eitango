<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>漢字マス試作</title>
<!--
  2026-10-24 試作ページ（塾長が端末で寸法を決めるため）。★生徒向けの導線は無い（どこからもリンクしない）。
  ・本番の書き画面（index.html の _kkiMakeItem / _kkiOnDown / _kkiOnMove / _kkiOnUp）を手本にしている：
    線は「枠の幅・高さに対する 0〜1 の割合」で保持／pointer + setPointerCapture／getCoalescedEvents／
    lineCap・lineJoin round／色 #111827／白背景／枠 2px #d1d5db 角丸 8px。
  ・★キャンバス（線の入る板）は1マス分×文字数の「1枚」。区切り線は後ろの別の層に描くだけ（線の保持・合成には入らない）。
  ・線の太さ：本番は max(3, 板の高さ×0.03)。ここでは板が縦に長くなるので「1マスの大きさ×0.03」（最低3px）にしている。
-->
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280; --accent:#7c3aed; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px 16px 80px; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  .panel { background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 12px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin: 4px 0; font-size: 14px; }
  .row label { font-weight: bold; }
  .val { font-weight: bold; color: var(--accent); min-width: 3.5em; display:inline-block; }
  input[type=range] { width: 100%; }
  .ticks { display:flex; justify-content:space-between; font-size: 11px; color: var(--sub); margin-top: -2px; }
  .seg button { border:1px solid #d1d5db; background:#fff; border-radius: 999px; padding:6px 10px; font-size:13px; }
  .seg button.on { background: var(--accent); color:#fff; border-color: var(--accent); }
  .btn-clear { border:none; background: linear-gradient(135deg,#f87171,#dc2626); color:#fff; font-weight:bold; border-radius:10px; padding:8px 14px; font-size:14px; }
  .info { font-size: 12px; color: var(--sub); }
  .info b { color: var(--ink); }
  .sec { background: var(--card); border-radius: 12px; padding: 10px 12px 14px; margin-bottom: 14px; }
  .sec h2 { font-size: 15px; margin: 2px 0 8px; }
  .items { display:flex; flex-wrap: wrap; gap: 18px; align-items:flex-start; }
  .items.horiz { flex-direction: column; }
  .item { min-width: 0; max-width: 100%; }
  .items.horiz .item { width: 100%; }
  .item .cap { font-size: 13px; margin-bottom: 4px; color: var(--sub); }
  .item .cap b { color: var(--ink); font-size: 15px; }
  /* 横並びは5文字で画面からはみ出すことがあるので、その時だけ横にスクロールできる箱に入れる */
  .hscroll { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  /* 1枚の板：白背景の枠（本番 .kki-pad と同じ枠）。中に「区切り線の層」と「線が入る板」を重ねる */
  .pad { position: relative; background:#fff; border: 2px solid #d1d5db; border-radius: 8px; box-sizing: content-box; }
  .pad canvas { position:absolute; left:0; top:0; display:block; }
  .pad canvas.ink { touch-action: none; cursor: crosshair; }
  .pad canvas.grid { pointer-events: none; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✏️ 漢字マス試作（寸法決め用）</h1>

  <div class="panel" id="panel">
    <div class="row">
      <label for="cell">1マスの大きさ</label>
      <span class="val" id="cell-val">—</span>
      <span class="info" id="cell-mm"></span>
    </div>
    <input type="range" id="cell" min="60" max="240" step="2" value="120" list="cell-ticks">
    <datalist id="cell-ticks">
      <option value="60"></option><option value="90"></option><option value="120"></option>
      <option value="150"></option><option value="180"></option><option value="210"></option><option value="240"></option>
    </datalist>
    <div class="ticks"><span>60</span><span>90</span><span>120</span><span>150</span><span>180</span><span>210</span><span>240px</span></div>

    <div class="row seg" id="layout-seg">
      <label>並べ方</label>
      <button data-v="both" class="on">両方</button>
      <button data-v="vert">縦だけ</button>
      <button data-v="horiz">横だけ</button>
    </div>

    <div class="row seg" id="line-seg">
      <label>区切り線</label>
      <button data-v="0">薄い実線</button>
      <button data-v="1" class="on">普通の実線</button>
      <button data-v="2">濃い実線</button>
      <button data-v="3">点線</button>
      <button data-v="4">破線</button>
      <button data-v="5">なし</button>
    </div>
    <div class="row">
      <label for="lw">線の太さ</label><span class="val" id="lw-val">—</span>
      <input type="range" id="lw" min="0.5" max="4" step="0.5" value="1.5" style="flex:1;min-width:140px">
      <label for="ld">濃さ</label><span class="val" id="ld-val">—</span>
      <input type="range" id="ld" min="10" max="90" step="5" value="45" style="flex:1;min-width:140px">
    </div>

    <div class="row">
      <button class="btn-clear" onclick="clearAll()">🧽 消す（全部）</button>
      <span class="info" id="screen-info"></span>
    </div>
  </div>

  <div class="sec" id="sec-vert">
    <h2>縦に並べた形（横幅は一定・縦＝1マス×文字数）</h2>
    <div class="items" id="items-vert"></div>
  </div>

  <div class="sec" id="sec-horiz">
    <h2>横に並べた形（縦は一定・横＝1マス×文字数）</h2>
    <div class="items horiz" id="items-horiz"></div>
  </div>

  <p class="note">
    ・各マスの板は1枚のキャンバスです（線は板の幅・高さに対する割合で保持）。区切り線は後ろの層に描いているだけで、書いた線とは別です。<br>
    ・板の上を触ると書けます（スクロールはしません）。ページのスクロールは板の外を触って行ってください。<br>
    ・「1マスの大きさ」を変えると、書いた字は板と一緒に拡大・縮小されます。<br>
    ・mm は目安です（端末の画面の細かさで多少ずれます）。
  </p>
</div>

<script>
(function(){
  'use strict';
  var SAMPLES = [ { n: 2, ans: '朗読' }, { n: 3, ans: '改める' }, { n: 5, ans: '移り変わる' } ];
  // 区切り線のプリセット：[太さpx, 濃さ%(黒の不透明度), 点線パターン]
  var LINE_PRESETS = [
    { w: 1,   a: 20, dash: null },
    { w: 1.5, a: 45, dash: null },
    { w: 2,   a: 75, dash: null },
    { w: 1.5, a: 45, dash: [2, 4] },
    { w: 1.5, a: 45, dash: [8, 6] },
    { w: 0,   a: 0,  dash: null }
  ];
  var state = { cell: 120, layout: 'both', preset: 1, lineW: 1.5, lineA: 45, dash: null };
  // 板ごとの線（id → [[x,y],...] の配列）。★割合で持つので大きさを変えても同じ形で描き直せる。
  var pads = {};      // id -> { strokes: [], n, dir, ink, grid, w, h }
  var current = null; // { pid, pad, pts }

  function $(id){ return document.getElementById(id); }
  function dpr(){ return Math.max(1, Math.min(3, window.devicePixelRatio || 1)); }
  function setupRect(cv, w, h) {
    var d = dpr();
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return ctx;
  }
  // 本番 _kkiDrawStrokes と同じ描き方。太さだけ「1マスの大きさ×0.03（最低3px）」。
  function drawStrokes(ctx, strokes, w, h) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = Math.max(3, state.cell * 0.03);
    strokes.forEach(function(st){
      if (!st || !st.length) return;
      ctx.beginPath();
      ctx.moveTo(st[0][0] * w, st[0][1] * h);
      if (st.length === 1) ctx.lineTo(st[0][0] * w + 0.01, st[0][1] * h);
      for (var i = 1; i < st.length; i++) ctx.lineTo(st[i][0] * w, st[i][1] * h);
      ctx.stroke();
    });
  }
  function drawGrid(p) {
    var ctx = setupRect(p.grid, p.w, p.h);
    if (!state.lineW || !state.lineA) return;
    ctx.strokeStyle = 'rgba(17,24,39,' + (state.lineA / 100) + ')';
    ctx.lineWidth = state.lineW;
    ctx.setLineDash(state.dash || []);
    for (var k = 1; k < p.n; k++) {
      ctx.beginPath();
      if (p.dir === 'v') { var y = Math.round(state.cell * k) + 0.5; ctx.moveTo(0, y); ctx.lineTo(p.w, y); }
      else               { var x = Math.round(state.cell * k) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, p.h); }
      ctx.stroke();
    }
  }
  function redrawInk(p) {
    var ctx = setupRect(p.ink, p.w, p.h);
    var list = p.strokes.slice();
    if (current && current.pad === p) list.push(current.pts);
    drawStrokes(ctx, list, p.w, p.h);
  }
  function sizePad(p) {
    p.w = p.dir === 'v' ? state.cell : state.cell * p.n;
    p.h = p.dir === 'v' ? state.cell * p.n : state.cell;
    p.box.style.width = p.w + 'px'; p.box.style.height = p.h + 'px';
    drawGrid(p); redrawInk(p);
  }
  function makePad(container, sample, dir) {
    var id = dir + sample.n;
    var item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = '<div class="cap"><b>' + sample.n + '文字</b>（例：' + sample.ans + '）<span class="sz"></span></div>';
    var box = document.createElement('div');
    box.className = 'pad';
    var grid = document.createElement('canvas'); grid.className = 'grid';
    var ink  = document.createElement('canvas'); ink.className = 'ink'; ink.setAttribute('data-id', id);
    box.appendChild(grid); box.appendChild(ink);
    if (dir === 'h') { var hs = document.createElement('div'); hs.className = 'hscroll'; hs.appendChild(box); item.appendChild(hs); }
    else item.appendChild(box);
    container.appendChild(item);
    var prev = pads[id];
    pads[id] = { strokes: prev ? prev.strokes : [], n: sample.n, dir: dir, ink: ink, grid: grid, box: box, cap: item.querySelector('.sz'), w: 0, h: 0 };
    bindInk(ink);
  }

  // --- 入力：本番 _kkiPoint / _kkiOnDown / _kkiOnMove / _kkiOnUp と同じ作法 ---
  function point(cv, e) {
    var r = cv.getBoundingClientRect();
    var w = cv.clientWidth || r.width || 1, h = cv.clientHeight || r.height || 1;
    var x = (e.clientX - r.left) / w, y = (e.clientY - r.top) / h;
    return [Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))];
  }
  function onDown(e) {
    var cv = e.currentTarget, p = pads[cv.getAttribute('data-id')];
    if (!p) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch(_e) {}
    current = { pid: e.pointerId, pad: p, pts: [point(cv, e)] };
    redrawInk(p);
  }
  function onMove(e) {
    if (!current || e.pointerId !== current.pid) return;
    e.preventDefault();
    var evs = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) current.pts.push(point(current.pad.ink, evs[i]));
    redrawInk(current.pad);
  }
  function onUp(e) {
    if (!current || e.pointerId !== current.pid) return;
    try { current.pad.ink.releasePointerCapture(e.pointerId); } catch(_e) {}
    var p = current.pad;
    p.strokes.push(current.pts);
    current = null;
    redrawInk(p);
  }
  function bindInk(cv) {
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    var stop = function(e){ if (e.cancelable) e.preventDefault(); };
    try {
      cv.addEventListener('touchstart', stop, { passive: false });
      cv.addEventListener('touchmove',  stop, { passive: false });
      cv.addEventListener('touchend',   stop, { passive: false });
    } catch(_e) {}
    cv.addEventListener('selectstart', stop);
    cv.addEventListener('contextmenu', stop);
    cv.addEventListener('dragstart', stop);
  }

  // --- 表示 ---
  function build() {
    $('items-vert').innerHTML = ''; $('items-horiz').innerHTML = '';
    SAMPLES.forEach(function(s){ makePad($('items-vert'), s, 'v'); makePad($('items-horiz'), s, 'h'); });
    $('sec-vert').style.display  = (state.layout === 'horiz') ? 'none' : '';
    $('sec-horiz').style.display = (state.layout === 'vert')  ? 'none' : '';
    refresh();
  }
  function mmOf(px) { return (px * 25.4 / 96); }   // CSS px → mm の目安（96dpi 基準）
  function refresh() {
    Object.keys(pads).forEach(function(id){
      var p = pads[id]; sizePad(p);
      if (p.cap) p.cap.textContent = '　板 ' + Math.round(p.w) + '×' + Math.round(p.h) + 'px';
    });
    $('cell-val').textContent = state.cell + 'px';
    $('cell-mm').textContent = '（目安 約' + mmOf(state.cell).toFixed(1) + 'mm 角・線の太さ ' + Math.max(3, state.cell * 0.03).toFixed(1) + 'px）';
    $('lw-val').textContent = state.lineW + 'px';
    $('ld-val').textContent = state.lineA + '%';
    var vw = window.innerWidth || document.documentElement.clientWidth || 1;
    $('screen-info').innerHTML = '画面幅 <b>' + vw + 'px</b>（高さ ' + window.innerHeight + 'px・dpr ' + Math.round((window.devicePixelRatio || 1) * 100) / 100 + '）／ 1マス <b>' + state.cell + 'px</b> ＝ 画面幅の <b>' + Math.round(state.cell / vw * 100) + '%</b>';
  }
  window.clearAll = function() {
    Object.keys(pads).forEach(function(id){ pads[id].strokes = []; });
    current = null;
    refresh();
  };
  function segInit(id, fn) {
    var seg = $(id);
    seg.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
      fn(b.getAttribute('data-v'));
    });
  }
  $('cell').addEventListener('input', function(){ state.cell = Number(this.value); refresh(); });
  $('lw').addEventListener('input', function(){ state.lineW = Number(this.value); refresh(); });
  $('ld').addEventListener('input', function(){ state.lineA = Number(this.value); refresh(); });
  segInit('layout-seg', function(v){ state.layout = v; build(); });
  segInit('line-seg', function(v){
    var pr = LINE_PRESETS[Number(v)];
    state.preset = Number(v); state.lineW = pr.w; state.lineA = pr.a; state.dash = pr.dash;
    if (pr.w) { $('lw').value = pr.w; $('ld').value = pr.a; }
    refresh();
  });
  window.addEventListener('resize', refresh);
  window.addEventListener('load', refresh);
  // 初期値：画面幅の 1/3 前後（スマホ 360〜430px なら 120〜140px）
  var vw0 = window.innerWidth || document.documentElement.clientWidth || 375;
  state.cell = Math.max(60, Math.min(240, Math.round(vw0 / 3 / 2) * 2));
  $('cell').value = state.cell;
  build();
})();
</script>
</body>
</html>
